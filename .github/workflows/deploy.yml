name: Déploiement GitHub Pages

on:
  push:
    # Temporaire : GitHub n'autorise la publication que depuis la branche par défaut du dépôt,
    # qui est encore claude/new-session-82l0uy. À retirer quand main sera la branche par défaut.
    branches: [main, claude/new-session-82l0uy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Les routes de l'application (ex. /carte) sont servies par index.html,
      # y compris quand on recharge la page ou qu'on ouvre un lien direct.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
